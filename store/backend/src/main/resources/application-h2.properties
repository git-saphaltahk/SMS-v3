spring.application.name=Mystore
server.port=8082

# MVP fallback: disable Elasticsearch so local H2 runs work without a separate search service.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.elasticsearch.ElasticsearchDataAutoConfiguration,org.springframework.boot.autoconfigure.data.elasticsearch.ElasticsearchRepositoriesAutoConfiguration
spring.data.elasticsearch.repositories.enabled=false

# H2 in-memory database (no MySQL required)
spring.datasource.url=jdbc:h2:mem:mystore;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# H2 Console for debugging
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT
app.jwt.secret=TEST_SECRET_KEY_FOR_DEV_TESTING_ONLY_1234567890
app.jwt.expiration-ms=86400000

# Stripe (test keys)
stripe.api.key=sk_test_51TkfycKxfc59rDPVI4PzJerbAL1d0jTQ6v9BX8b9OKSkOzzRcEAaLkmi0Px2u2yipCg6M79ozGGQOMhxSrHyzM5l00sTjFUAtB
stripe.webhook.secret=whsec_test

# Frontend URL
