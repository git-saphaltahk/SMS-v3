spring.application.name=Mystore
# =========================
# App basics
# =========================
server.port=8082

# MVP fallback: disable Elasticsearch by default so the API can run without a local search cluster.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.elasticsearch.ElasticsearchDataAutoConfiguration,org.springframework.boot.autoconfigure.data.elasticsearch.ElasticsearchRepositoriesAutoConfiguration
spring.data.elasticsearch.repositories.enabled=false

# =========================
# MySQL
# =========================
spring.datasource.url=jdbc:mysql://Localhost:3306/mystore?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=miracle2024

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
# =========================
# JWT (MVP)
# =========================
app.jwt.secret=CHANGE_ME_TO_A_LONG_RANDOM_SECRET
app.jwt.expiration-ms=86400000

